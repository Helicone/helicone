name: E2E Test Suite

on:
  push:
    branches:
      - main
      - justin/get-full-testing-suite
      - ci/*
  pull_request:
    branches:
      - ci/*

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Clickhouse and Minio
        run: cd docker && docker compose up minio minio-setup clickhouse -d

      - name: Start Supabase
        run: |
          echo 'y' | npx supabase start -x realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Start Gateway Workers
        run: |
          cd worker
          yarn install
          mkdir -p logs
          # Containers are disabled: two concurrent `wrangler dev` processes race
          # building/inspecting the RequestBodyBuffer image and fail health checks.
          # The worker falls back to the in-memory buffer when the container is
          # unavailable (RequestBodyBufferBuilder), which is fine for e2e traffic.
          echo "Starting OPENAI_PROXY worker on port 8787 (token-bucket suite targets it)..."
          npx wrangler dev --var WORKER_TYPE:OPENAI_PROXY --port 8787 --inspector-port=9239 --enable-containers=false > logs/wrangler-openai-proxy.log 2>&1 &
          echo $! > logs/wrangler-openai-proxy.pid
          echo "Starting HELICONE_API worker on port 8788..."
          npx wrangler dev --var WORKER_TYPE:HELICONE_API --port 8788 --inspector-port=9240 --enable-containers=false > logs/wrangler-helicone-api.log 2>&1 &
          echo $! > logs/wrangler-helicone-api.pid
          echo "Starting AI_GATEWAY_API worker on port 8793..."
          npx wrangler dev --var WORKER_TYPE:AI_GATEWAY_API --var HELICONE_ORG_ID:"a75d76e3-02e7-4d02-8a2b-c65ed27c69b2" --port 8793 --inspector-port=9241 --enable-containers=false > logs/wrangler-ai-gateway.log 2>&1 &
          echo $! > logs/wrangler-ai-gateway.pid
          echo "Waiting for workers to start..."
          sleep 10

      - name: Health Check Workers
        run: |
          echo "Checking if workers are running..."
          MAX_RETRIES=30
          RETRY_DELAY=2

          # Check OPENAI_PROXY worker (port 8787)
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -f http://localhost:8787/healthcheck 2>/dev/null; then
              echo "✓ OPENAI_PROXY worker is running on port 8787"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "✗ OPENAI_PROXY worker failed to start on port 8787"
              echo "Last 50 lines of wrangler-openai-proxy.log:"
              tail -50 worker/logs/wrangler-openai-proxy.log || true
              exit 1
            fi
            echo "Waiting for OPENAI_PROXY worker... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_DELAY
          done

          # Check HELICONE_API worker (port 8788)
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -f http://localhost:8788/healthcheck 2>/dev/null; then
              echo "✓ HELICONE_API worker is running on port 8788"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "✗ HELICONE_API worker failed to start on port 8788"
              echo "Last 50 lines of wrangler-helicone-api.log:"
              tail -50 worker/logs/wrangler-helicone-api.log || true
              exit 1
            fi
            echo "Waiting for HELICONE_API worker... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_DELAY
          done

          # Check AI_GATEWAY_API worker (port 8793)
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -f http://localhost:8793/healthcheck 2>/dev/null; then
              echo "✓ AI_GATEWAY_API worker is running on port 8793"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "✗ AI_GATEWAY_API worker failed to start on port 8793"
              echo "Last 50 lines of wrangler-ai-gateway.log:"
              tail -50 worker/logs/wrangler-ai-gateway.log || true
              exit 1
            fi
            echo "Waiting for AI_GATEWAY_API worker... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_DELAY
          done

          echo "All workers are running!"

      - name: Start Jawn
        run: |
          cd valhalla/jawn
          cp .env.hosted.example .env
          yarn install
          yarn dev &
          sleep 10

      - name: Run E2E Tests
        run: |
          cd e2e
          yarn install
          # tests/nightly needs live provider keys and runs in the nightly workflow
          yarn test tests/on-push

      - name: Display Logs on Failure
        if: failure()
        run: |
          echo "========================================="
          echo "OPENAI_PROXY Worker Logs (last 100 lines)"
          echo "========================================="
          tail -100 worker/logs/wrangler-openai-proxy.log || echo "No logs found for OPENAI_PROXY worker"
          echo ""
          echo "========================================="
          echo "HELICONE_API Worker Logs (last 100 lines)"
          echo "========================================="
          tail -100 worker/logs/wrangler-helicone-api.log || echo "No logs found for HELICONE_API worker"
          echo ""
          echo "========================================="
          echo "AI_GATEWAY_API Worker Logs (last 100 lines)"
          echo "========================================="
          tail -100 worker/logs/wrangler-ai-gateway.log || echo "No logs found for AI_GATEWAY_API worker"
          echo ""
          echo "========================================="
          echo "Worker Process Status"
          echo "========================================="
          ps aux | grep wrangler || echo "No wrangler processes found"

      - name: Cleanup
        if: always()
        run: |
          pkill -f wrangler || true
          pkill -f "yarn dev" || true
          supabase stop --no-backup || true
          cd docker && docker compose down || true
